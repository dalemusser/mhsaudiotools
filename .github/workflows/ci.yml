# Runs on every push and PR — the release workflow only fires on tags, so
# without this, day-to-day commits get no CI at all.
#
# The engine/CLI job is the same gate release.yml runs. The app job go-vets and
# go-builds the wails module on macOS (its cgo webview needs no extra packages
# there); `wails build` itself stays release-only.
#
# Release pushes: putting "[release]" in the commit message skips this workflow
# — the tag push runs release.yml moments later, whose verify job covers the
# same ground, so a release day shows exactly one Actions run. (Deliberately
# NOT GitHub's "[skip ci]", which would also suppress the tag-triggered
# release workflow itself.)

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine-cli:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # zero-dep module: no go.sum to key a cache on
      - run: make verify

  app:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - working-directory: wails
        run: |
          go build ./...
          go vet ./...
